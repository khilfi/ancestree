[package]
name = "ancestree-desktop"
version = "0.8.5"
description = "AncesTree's desktop app"
license = "MIT"
edition = "2021"
publish = false

[dev-dependencies]
# The app's updater checks signatures with it: its test checks one made in Python (0.4.2).
minisign-verify = "=0.2.5"

[features]
# Settings for tests read from the environment (0.4.2): the Desktop app workflow builds with it,
# a release never does.
test-settings = []

[profile.release]
codegen-units = 1
lto = true
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
winreg = "0.55"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
