[project]
name = "ancestree"
version = "0.1.0"
description = "Private family-history app: people, relationships, kinship, timeline."
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "neo4j>=6.3.1",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ancestree = "ancestree.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "testcontainers[neo4j]>=4.15.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# Avast's HTTPS scanning re-signs pypi.org with a root that only the Windows
# certificate store trusts, so uv must use that store. Harmless elsewhere.
system-certs = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "PT", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["integration: starts a throwaway Neo4j in Docker"]
