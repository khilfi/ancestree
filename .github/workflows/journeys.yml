# The journeys: the app's main journeys in a browser, on the made-up example family, at 800 × 600
# and 1366 × 768, at each push to main that changes the app, on macOS (Apple Silicon) and Linux.
#
# Each system: the backend's packages; the app's own Neo4j and Java, fetched once by its own
# fetcher, each checked against its SHA-256; the app's pages; and Playwright's Chromium, fetched
# by Playwright onto GitHub's machine. The journeys start AncesTree's engine from the code on a
# folder of their own, and their pages reach nothing outside the machine. They compare no
# pictures here: each system draws text its own way, and the pictures are of Windows', compared
# where they're taken (frontend/playwright.config.ts). Windows isn't run here for that reason.

name: Journeys

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A release's update file and notes change nothing in the app.
    paths-ignore: ["updates/**", "release-notes/**", "README.md"]

permissions:
  contents: read

jobs:
  journeys:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # The engine on uv's own Python, of the version backend/.python-version names, as the
      # desktop checks build it (0.8.6).
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false  # no step after this can read a token from .git

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: The backend's packages, and the app's own Neo4j and Java
        working-directory: backend
        run: |
          uv sync --locked
          uv run --no-sync ancestree fetch-neo4j "$RUNNER_TEMP/neo4j"
          echo "ANCESTREE_NEO4J_RUNTIME=$RUNNER_TEMP/neo4j" >> "$GITHUB_ENV"
          echo "ANCESTREE_JOURNEYS_FOLDER=$RUNNER_TEMP/journeys" >> "$GITHUB_ENV"

      - name: The app's pages, and Playwright's Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
          pnpm exec playwright install --with-deps chromium

      - name: The journeys
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journeys-${{ runner.os }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/journeys/*/engine.log
          if-no-files-found: warn
