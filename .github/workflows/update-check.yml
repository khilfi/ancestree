# Does a release really update an older install? On each system, it installs the release before
# the one on offer, from this repository's releases, starts it just as a user would, and waits
# for it to update itself to the version latest.json offers. It runs whenever a new latest.json
# is pushed, and can be started by hand from any older version. Nothing here is made for the
# test: the releases, the update file and its signatures are the real ones. A release from before
# the update key changed can't update itself past the change: the check says so, and stops.

name: Update check

on:
  push:
    branches: [main]
    paths: ["updates/latest.json"]
  workflow_dispatch:
    inputs:
      from:
        description: The older version to install, such as 0.1.0. By default, the release before the one on offer
        required: false

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      from: ${{ steps.pick.outputs.from }}
      to: ${{ steps.pick.outputs.to }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # every release's tag, to read the key it trusts
          persist-credentials: false

      - id: pick
        env:
          FROM: ${{ inputs.from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          to=$(jq -r .version updates/latest.json)
          from="${FROM#v}"
          if [ -z "$from" ]; then  # the release just before the one on offer
            from=$( { gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | sed 's/^v//'; echo "$to"; } \
              | sort -uV | grep -F -x -B1 "$to" | head -n 1 )
            [ "$from" != "$to" ] || from=""
          fi
          [ "$from" != "$to" ] || { echo "::error::$to is already the version on offer"; exit 1; }
          [ -n "$from" ] || echo "::notice::$to is the first release: there's nothing older to update from"
          if [ -n "$from" ]; then  # an older release trusts only the key that was the app's then
            trusted=$(git show "v$from:desktop/src-tauri/tauri.conf.json" | jq -r .plugins.updater.pubkey)
            if [ "$trusted" != "$(jq -r .plugins.updater.pubkey desktop/src-tauri/tauri.conf.json)" ]; then
              echo "::notice::$from trusts an earlier update key, so it can't update itself to $to: it's installed again by hand"
              from=""
            fi
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "from $from to $to"

  update:
    needs: versions
    if: needs.versions.outputs.from != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      APP_ID: app.ancestree.desktop
      FROM: ${{ needs.versions.outputs.from }}
      TO: ${{ needs.versions.outputs.to }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Linux packages for Tauri and a screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: The older release, installed
        run: |
          case "$RUNNER_OS" in
            Windows)
              gh release download "v$FROM" --repo "$GITHUB_REPOSITORY" --pattern "*_x64-setup.exe" --dir old
              ./old/AncesTree_${FROM}_x64-setup.exe //S
              echo "APP=$LOCALAPPDATA/AncesTree/AncesTree.exe" >> "$GITHUB_ENV"
              echo "DATA=$LOCALAPPDATA/$APP_ID" >> "$GITHUB_ENV" ;;
            macOS)
              gh release download "v$FROM" --repo "$GITHUB_REPOSITORY" --pattern "*.app.tar.gz" --dir old
              mkdir -p "$HOME/Applications"
              tar -xzf old/*.app.tar.gz -C "$HOME/Applications"
              echo "APP=$HOME/Applications/AncesTree.app/Contents/MacOS/AncesTree" >> "$GITHUB_ENV"
              echo "DATA=$HOME/Library/Application Support/$APP_ID" >> "$GITHUB_ENV" ;;
            Linux)
              gh release download "v$FROM" --repo "$GITHUB_REPOSITORY" --pattern "*.AppImage" --dir old
              mkdir -p "$HOME/apps"
              cp old/*.AppImage "$HOME/apps/AncesTree.AppImage"
              chmod +x "$HOME/apps/AncesTree.AppImage"
              echo "APP=$HOME/apps/AncesTree.AppImage" >> "$GITHUB_ENV"
              echo "DATA=$HOME/.local/share/$APP_ID" >> "$GITHUB_ENV" ;;
          esac

      - name: The new version on offer, where the app looks
        run: |
          # GitHub serves a newly pushed file there within a few minutes.
          for i in $(seq 1 60); do
            curl -sf "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/updates/latest.json" \
              | grep -Eq "\"version\": *\"$TO\"" && exit 0
            sleep 10
          done
          echo "::error::latest.json never offered $TO"; exit 1

      - name: Started as a user would, it updates itself
        run: |
          "$APP" &
          for i in $(seq 1 60); do grep -q "starting $TO" "$DATA/logs/shell.log" 2>/dev/null && break; sleep 5; done
          grep -E "starting|update|install" "$DATA/logs/shell.log"
          grep -q "starting $FROM" "$DATA/logs/shell.log"
          grep -q "starting $TO" "$DATA/logs/shell.log"

      - name: The new version's engine, with its own files alone
        run: |
          # As it starts, the engine says its version: the new one's, built into it, never an
          # earlier one's an update left beside it (0.8.1, D76).
          said="\"stage\": \"preparing\", \"version\": \"$TO\""
          for i in $(seq 1 60); do grep -qF "$said" "$DATA/logs/shell.log" 2>/dev/null && break; sleep 5; done
          grep -F '"stage": "preparing"' "$DATA/logs/shell.log"
          grep -qF "$said" "$DATA/logs/shell.log"
          if grep -qF '"stage": "versions-differ"' "$DATA/logs/shell.log"; then
            echo "::error::the app and its engine are of different versions"; exit 1
          fi
          case "$RUNNER_OS" in
            Windows) engine="$LOCALAPPDATA/AncesTree/engine" ;;
            macOS) engine="$HOME/Applications/AncesTree.app/Contents/Resources/engine" ;;
            Linux)
              (cd "$RUNNER_TEMP" && "$APP" --appimage-extract > /dev/null)
              engine="$RUNNER_TEMP/squashfs-root/usr/share/AncesTree/engine" ;;
          esac
          # One record of the package, the new version's; and no file but the engine's own.
          records=$(find "$engine" -maxdepth 3 -type d -name 'ancestree-*.dist-info' | sort)
          echo "$records"
          if [ "$(echo "$records" | wc -l)" -ne 1 ] || ! echo "$records" | grep -q "ancestree-$TO.dist-info"; then
            echo "::error::the engine holds another version's record"; exit 1
          fi
          (cd "$engine" && find . -type f | sed 's|^\./||' | sort) > found.txt
          { tr -d '\r' < "$engine/install-files.txt"; echo install-files.txt; } | sort > own.txt
          extra=$(comm -23 found.txt own.txt)
          [ -z "$extra" ] || { echo "::error::left beside the new version: $extra"; exit 1; }

      - name: What the app wrote, when something failed
        if: failure()
        run: tail -n 60 "$DATA/logs/shell.log" "$DATA/logs/engine.log" 2>/dev/null || true
