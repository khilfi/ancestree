# A release: a version tag, such as v0.2.0, builds AncesTree for Windows, macOS (Apple Silicon)
# and Linux, and puts in the tag's release the installers, each system's update file and their
# SHA-256 sums. It holds no key: each build signs its update file with a key made for the run
# and thrown away, and the maintainer signs the files again on their own computer. Installed
# apps check updates against the maintainer's public key alone, which is built into them.
#
# The builds run other people's code (packages from npm, crates.io and PyPI), so they can
# change nothing: they read the repository, and hand what they made on. Only the last job,
# which runs none of it, may write to the release. It also has GitHub attest where each file
# was built, from which commit, so the maintainer's release.py can check that before signing.
# Every action is pinned to the commit of the version named beside it: a tag can be moved.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to make the release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: The release, with what's new in it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="release-notes/$version.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing: write what's new first"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "AncesTree $version" --notes-file "$notes" --verify-tag

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false  # no step after this can read a token from .git

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
          # linuxdeploy, which makes the AppImage, would strip every library it finds, with a
          # strip too old for some of them. They're fine as they come.
          echo "NO_STRIP=true" >> "$GITHUB_ENV"

      - name: The app's pages
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build && pnpm build:viewer

      - name: The engine
        working-directory: backend
        # No Google client goes in: each family signs in through its keeper's own Google
        # project, given to AncesTree by the keeper, and to relatives in the keeper's invitation.
        # PyInstaller is the one uv.lock holds (the build group), with its checksums.
        run: |
          uv run --locked --group build pyinstaller ../desktop/engine/engine.spec --noconfirm \
            --distpath ../desktop/engine/dist --workpath ../desktop/engine/build

      - name: The app
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          # A key for this run alone: the maintainer signs the update files again later.
          pnpm tauri signer generate -w "$RUNNER_TEMP/run.key" -p run --ci
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=run
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/run.key")"
          # --locked: the crates Cargo.lock holds, and no others.
          pnpm tauri build --verbose --bundles ${{ matrix.bundles }} \
            --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}" -- --locked

      - name: What's for the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p out
          case "$RUNNER_OS" in
            Windows)
              cp "$bundle/nsis/AncesTree_${version}_x64-setup.exe" out/ ;;
            macOS)
              cp "$bundle/dmg/AncesTree_${version}_aarch64.dmg" out/
              cp "$bundle/macos/AncesTree.app.tar.gz" "out/AncesTree_${version}_aarch64.app.tar.gz" ;;
            Linux)
              cp "$bundle/appimage/AncesTree_${version}_amd64.AppImage" out/ ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to put the files in the release
      id-token: write  # to attest where they were built
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: files

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: files/*

      - name: Into the release, with SHA256SUMS.txt, which release.py checks each file against
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" ./* ../SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
